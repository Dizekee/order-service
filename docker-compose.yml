services:
  postgres:
    image: postgres:15-alpine
    container_name: order_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-orders}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  supplier-a:
    build:
      context: .
      dockerfile: supplier/mock/Dockerfile
    container_name: supplier_a
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - FAIL_RATE=0.3
      - TIMEOUT_RATE=0.2
      - TIMEOUT_DURATION=5s
      - SUPPLIER_ID=A
    restart: unless-stopped

  supplier-b:
    build:
      context: .
      dockerfile: supplier/mock/Dockerfile
    container_name: supplier_b
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - FAIL_RATE=0.4
      - TIMEOUT_RATE=0.1
      - TIMEOUT_DURATION=5s
      - SUPPLIER_ID=B
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_app
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      supplier-a:
        condition: service_started
      supplier-b:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-orders}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      PORT: ${PORT:-8080}
      SUPPLIER_A_URL: http://supplier-a:8081
      SUPPLIER_B_URL: http://supplier-b:8082
      SUPPLIER_TIMEOUT: ${SUPPLIER_TIMEOUT:-3s}
      SUPPLIER_RETRY_MAX: ${SUPPLIER_RETRY_MAX:-3}
      SUPPLIER_RETRY_BACKOFF: ${SUPPLIER_RETRY_BACKOFF:-1s}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./.env:/root/.env
    restart: unless-stopped

volumes:
  postgres_data:
