version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: order_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # автоматический запуск миграций при первом старте
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_app
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      PORT: ${PORT}
      SUPPLIER_A_URL: ${SUPPLIER_A_URL}
      SUPPLIER_B_URL: ${SUPPLIER_B_URL}
      SUPPLIER_TIMEOUT: ${SUPPLIER_TIMEOUT}
      SUPPLIER_RETRY_MAX: ${SUPPLIER_RETRY_MAX}
      SUPPLIER_RETRY_BACKOFF: ${SUPPLIER_RETRY_BACKOFF}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./.env:/root/.env
    restart: unless-stopped

